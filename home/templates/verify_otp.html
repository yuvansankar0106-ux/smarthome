<!DOCTYPE html>
<html>
<head>
<style>
body{height:100vh;display:flex;justify-content:center;align-items:center;background:#080808;color:white;font-family:sans-serif}
.box{background:rgba(255,255,255,0.1);padding:50px;border-radius:20px;backdrop-filter:blur(20px);text-align:center;border:1px solid rgba(255,255,255,0.2)}
.tick{font-size:60px;color:#00ff88;display:none}
</style>
</head>
<body>
<div class="box">
<h2 id="text">Verifying...</h2>
<div class="tick" id="tick">✓</div>
<p id="sub">Checking security code</p>
</div>

<form method="POST" id="f" style="display:none">{% csrf_token %}</form>

<script>
// 2.5 sec ku aprom tick varum
setTimeout(()=>{
 document.getElementById('text').innerText = 'Verified & Secured';
 document.getElementById('sub').innerText = 'Redirecting to dashboard...';
 document.getElementById('tick').style.display='block';
},1500);

// 4 sec ku aprom dashboard ku pogum
setTimeout(()=>{
 document.getElementById('f').submit();
},3500);
</script>
</body>
</html>
