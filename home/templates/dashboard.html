<!DOCTYPE html>
<html>
<head>
<title>SmartHome Advance - Yuvan</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;font-family:'Segoe UI';padding:20px}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(15px);border-radius:20px;padding:20px;margin:15px 0;border:1px solid rgba(255,255,255,0.2)}
.switch{position:relative;display:inline-block;width:60px;height:34px;float:right}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.4s;border-radius:34px}
.slider:before{position:absolute;content:"";height:26px;width:26px;left:4px;bottom:4px;background:white;transition:.4s;border-radius:50%}
input:checked +.slider{background:#00ffcc}
input:checked +.slider:before{transform:translateX(26px)}
</style>
</head>
<body>
<h1>🏠 SmartHome ADVANCE v3.0</h1>
<p>Welcome Yuvansankar! All AI Systems Online 🤖</p>

<div class="card">
<h3>🌡️ Living Room - <span id="temp">24</span>°C</h3>
<canvas id="tempChart" height="100"></canvas>
</div>

<div class="card">
💡 Living Room Light
<label class="switch"><input type="checkbox" id="light" onchange="toggle('Light')"><span class="slider"></span></label>
<br><small id="lightStatus">Status: OFF</small>
</div>

<div class="card">
❄️ AC Control
<label class="switch"><input type="checkbox" id="ac" checked onchange="toggle('AC')"><span class="slider"></span></label>
<br><small id="acStatus">Status: ON - 24°C</small>
</div>

<div class="card">
🔒 Security <button onclick="voice()" style="float:right;padding:8px 15px;border-radius:10px;background:#00ffcc;border:0;font-weight:bold">🎤 Voice Command</button>
<br><small>All Doors Locked ✅ | Camera Active</small>
</div>

<script>
// Live Graph
const ctx=document.getElementById('tempChart').getContext('2d');
const chart=new Chart(ctx,{type:'line',data:{labels:['1m','2m','3m','4m','5m','Now'],datasets:[{label:'Temp',data:[22,23,22,24,23,24],borderColor:'#00ffcc',tension:0.4}]},options:{plugins:{legend:{display:false}}}});

// Toggle Function
function toggle(device){
let status=document.getElementById(device.toLowerCase()).checked;
document.getElementById(device.toLowerCase()+'Status').innerText='Status: '+(status?'ON 🔥':'OFF');
if(status){new Audio().play();} // dummy
}

// Voice Control
function voice(){
if('webkitSpeechRecognition' in window){
let rec=new webkitSpeechRecognition();rec.lang='en-US';rec.start();
rec.onresult=function(e){
let cmd=e.results[0][0].transcript.toLowerCase();
alert('You said: '+cmd);
if(cmd.includes('light on')){document.getElementById('light').checked=true;toggle('Light');}
if(cmd.includes('light off')){document.getElementById('light').checked=false;toggle('Light');}
}
}else{alert('Voice not supported - Chrome la try pannu da!');}
}

// Auto Temp Change
setInterval(()=>{let t=Math.floor(22+Math.random()*4);document.getElementById('temp').innerText=t;},3000);
</script>
<br><center>| Made by Yuvansankar | v3.0 AI</center>
</body>
</html>
